<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="publierprofil.css"/>
  <title>Publier un profil de recherche</title>
</head>
<body>
  <header class="main-header">
    <div class="nav-container">
    </div>
  </header>

  <main>
    <h1>Publier votre profil</h1>
    <form id="profilForm">
      <label>Nom complet :
        <input type="text" name="nom" required>
      </label>

      <label>Âge :
        <input type="number" name="age" required placeholder="Exemple : 25">
      </label>

      <label>Budget mensuel (FCFA) :
        <input type="number" name="budget" required>
      </label>

      <label>Quartiers souhaités :
        <input type="text" name="quartiers" required placeholder="Exemple : Cocody, Angré">
      </label>

      <fieldset>
        <legend>Type de chambre recherché :</legend>
        <label><input type="radio" name="type_chambre" value="Chambre simple" required> Chambre simple</label>
        <label><input type="radio" name="type_chambre" value="Chambre double"> Chambre double</label>
        <label><input type="radio" name="type_chambre" value="Studio"> Studio</label>
      </fieldset>

      <fieldset>
        <legend>Préférences :</legend>
        <label><input type="checkbox" name="fumeur"> J'accepte les colocations avec fumeurs</label>
        <label><input type="checkbox" name="animaux"> J'accepte les animaux</label>
        <label><input type="checkbox" name="sexe[]" value="Homme"> Homme</label>
        <label><input type="checkbox" name="sexe[]" value="Femme"> Femme</label>
      </fieldset>

      <label>Numéro de téléphone :
        <input type="tel" name="num" placeholder="07 55 44 55 65" maxlength="14" required>
      </label>

      <label>Description personnelle :
        <textarea name="description" required placeholder="Décrivez vos attentes, votre personnalité, etc."></textarea>
      </label>

      <label>Photo de profil :
        <input type="file" name="image" accept="image/*" required>
      </label>

      <button type="submit">Publier votre profil</button>
    </form>

    <div id="confirmation" style="display: none;"></div>
  </main>

  <script src="publierprofil.js"></script>
</body>
</html>
